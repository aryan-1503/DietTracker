name: Build and Deploy DietTracker.API to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: 'eat-track' # Set this to your Azure Web App name
  DOTNET_VERSION: '10.0.x' # Or adjust to your .NET SDK version (e.g. 9.0.x / 8.0.x)
  PROJECT_PATH: 'DietTracker.API/DietTracker.API.csproj'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore DietTracker.API/DietTracker.API.csproj

      - name: Build project
        run: dotnet build DietTracker.API/DietTracker.API.csproj --configuration Release --no-restore

      - name: Publish API project
        run: dotnet publish DietTracker.API/DietTracker.API.csproj -c Release -o ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
